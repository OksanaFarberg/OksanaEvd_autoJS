name: CI Workflow
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  eslint:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
      - uses: actions/cache@v4
        cache: 'npm'
      - run: npm ci
      - run: npm run lint

  prettier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
      - uses: actions/cache@v4
        cache: 'npm'
      - run: npm ci
      - run: npm run format

  test:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.0
      - uses: actions/cache@v4
        cache: 'npm'
      - run: npm ci
      - run: echo "${{secrets.ENV_FILE}}" >> .env
      - run: npm run test
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        run: |
          ls -la reports/html-reports
          if [ ! -d "reports/html-reports" ]; then
            mkdir -p reports/html-reports
          fi

  notification:
    if: always()
    needs: [codestyle, test]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - run: |
            curl --request POST \
              --url https://api.telegram.org/bot${{vars.TELEGRAM_TOKEN}}/sendMessage \
              --header 'Content-Type: application/json' \
              --data '{ "chat_id": "${{secrets.TELEGRAM_CHAT_ID}}", "text": "Report link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" }'